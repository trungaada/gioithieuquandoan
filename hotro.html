<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trung Tâm Hỗ Trợ — TitanForce Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --bg-dark: #030712;
    --card-bg: rgba(13, 22, 41, 0.7);
    --card-border: rgba(255, 255, 255, 0.1);
    --primary: #ff3366;
    --primary-glow: rgba(255, 51, 102, 0.4);
    --cyan: #00f2fe;
    --cyan-glow: rgba(0, 242, 254, 0.35);
    --gold: #ffb703;
    --gold-glow: rgba(255, 183, 3, 0.3);
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 51, 102, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.9) 0%, var(--bg-dark) 100%);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 880px;
    position: relative;
    z-index: 2;
}

/* Cyber Grid Background overlay */
.container::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px; right: -60px; bottom: -60px;
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 36px 36px;
    z-index: -1;
    pointer-events: none;
    mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
    -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
}

/* Header Section */
header {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 28px 36px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border: 1px solid var(--card-border);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    position: relative;
    overflow: hidden;
}

header::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--primary), transparent);
    animation: scanline 4s linear infinite;
}

@keyframes scanline {
    0% { left: -100%; }
    100% { left: 100%; }
}

.header-title h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1.5px;
    background: linear-gradient(135deg, #ffffff 40%, var(--cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.3));
}

.header-title p {
    font-size: 13.5px;
    color: var(--text-sub);
    margin-top: 6px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-title p::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan);
}

.btn-home {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-main);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
    position: relative;
    overflow: hidden;
}

.btn-home:hover {
    background: linear-gradient(135deg, var(--primary) 0%, #e01e5a 100%);
    border-color: transparent;
    box-shadow: 0 0 25px var(--primary-glow);
    transform: translateY(-2px);
}

/* Info Grid */
.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
}

.info-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    border: 1px solid var(--card-border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease, border-color 0.3s ease;
}

.info-card:hover {
    transform: translateY(-2px);
}

.info-card.schedule:hover { border-color: rgba(0, 242, 254, 0.3); }
.info-card.security:hover { border-color: rgba(255, 183, 3, 0.3); }

.info-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.info-card.schedule .info-icon {
    background: rgba(0, 242, 254, 0.1);
    color: var(--cyan);
    border: 1px solid rgba(0, 242, 254, 0.25);
    box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.15);
}

.info-card.security .info-icon {
    background: rgba(255, 183, 3, 0.1);
    color: var(--gold);
    border: 1px solid rgba(255, 183, 3, 0.25);
    box-shadow: inset 0 0 15px rgba(255, 183, 3, 0.15);
}

.info-text label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-sub);
    font-weight: 800;
    margin-bottom: 3px;
}

.info-text span {
    font-size: 13px;
    color: var(--text-main);
    font-weight: 600;
    line-height: 1.4;
}

/* Support Staff Cards */
.support-wrapper {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.support-card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    border: 1px solid var(--card-border);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
}

.support-card:hover {
    transform: translateY(-4px) scale(1.01);
    border-color: rgba(0, 242, 254, 0.4);
    box-shadow: 0 20px 40px rgba(0, 242, 254, 0.12), 0 0 20px rgba(0, 242, 254, 0.05);
}

.avatar-box {
    position: relative;
    width: 72px;
    height: 72px;
    flex-shrink: 0;
}

.avatar-box img {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    transition: transform 0.3s ease;
}

.support-card:hover .avatar-box img {
    transform: scale(1.05);
    border-color: var(--cyan);
}

.status-online {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 18px;
    height: 18px;
    background: #10b981;
    border-radius: 50%;
    border: 3px solid #0d1629;
    box-shadow: 0 0 12px #10b981;
    animation: pulse-green 2s infinite;
}

@keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.details {
    flex: 1;
}

.badge-role {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--cyan);
    background: rgba(0, 242, 254, 0.08);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(0, 242, 254, 0.25);
    margin-bottom: 12px;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
}

.tags-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.tag-item {
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
}

.support-card:hover .tag-item {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.15);
}

.tag-item i {
    font-size: 13px;
}

/* Action Buttons */
.action-buttons {
    display: flex;
    gap: 12px;
}

.btn-action {
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 13.5px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-chat {
    background: linear-gradient(135deg, var(--primary) 0%, #e01e5a 100%);
    color: white;
    box-shadow: 0 6px 20px var(--primary-glow);
}

.btn-chat:hover {
    box-shadow: 0 8px 30px var(--primary-glow);
    transform: translateY(-2px);
    filter: brightness(1.1);
}

.btn-copy {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

.btn-copy:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
}

/* Footer */
footer {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--text-sub);
}

footer a {
    color: var(--cyan);
    text-decoration: none;
    font-weight: 700;
    transition: all 0.2s;
    position: relative;
}

footer a:hover {
    text-shadow: 0 0 10px var(--cyan-glow);
}

/* Responsive Customization */
@media (max-width: 768px) {
    .info-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    body { padding: 16px 10px; }

    header {
        flex-direction: column;
        align-items: flex-start;
        padding: 22px 20px;
    }

    .btn-home {
        width: 100%;
        justify-content: center;
    }

    .support-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 22px 20px;
    }

    .action-buttons {
        width: 100%;
        margin-top: 4px;
    }

    .btn-action {
        flex: 1;
        justify-content: center;
    }
}
</style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>TITANFORCE SUPPORT</h1>
            <p>Hệ thống hỗ trợ trực tuyến kỹ thuật & tài khoản 24/7</p>
        </div>
        <button class="btn-home" onclick="goIndex()">
            <i class="fa-solid fa-house-user"></i> Trang Chủ
        </button>
    </header>

    <div class="info-grid">
        <div class="info-card schedule">
            <div class="info-icon"><i class="fa-regular fa-clock"></i></div>
            <div class="info-text">
                <label>Thời Gian Làm Việc</label>
                <span>T2-T6: 07:00-21:00 | T7-CN: 07:00-23:30</span>
            </div>
        </div>
        
        <div class="info-card security">
            <div class="info-icon"><i class="fa-solid fa-user-shield"></i></div>
            <div class="info-text">
                <label>Bảo Mật An Toàn</label>
                <span>Tuyệt đối không cấp Mật khẩu & Mã OTP</span>
            </div>
        </div>
    </div>

    <div class="support-wrapper">
        <!-- Support Card 1 -->
        <div class="support-card" data-fb="https://www.facebook.com/share/1BgP2pED8P/">
            <div class="avatar-box">
                <img src="trung1.jpg" alt="Avatar Hỗ Trợ" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=TitanSupport'">
                <div class="status-online"></div>
            </div>

            <div class="details">
                <div class="badge-role"><i class="fa-solid fa-headset"></i> Hỗ Trợ Kỹ Thuật Web</div>
                <div class="tags-container">
                    <span class="tag-item"><i class="fa-solid fa-circle-exclamation" style="color:var(--primary)"></i> Lỗi đăng ký tài khoản</span>
                    <span class="tag-item"><i class="fa-solid fa-wifi" style="color:var(--cyan)"></i> Lỗi kết nối Server</span>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-action btn-chat" onclick="openFB(this)">
                    <i class="fa-brands fa-facebook-messenger"></i> Nhắn Tin
                </button>
                <button class="btn-action btn-copy" onclick="copyLink(this)">
                    <i class="fa-regular fa-copy"></i> Sao Chép
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>Thiết kế bởi <a href="gioithieu.html" target="_blank">TF.Kuronami</a> • © 2025 Quân đoàn TitanForce</p>
    </footer>
</div>

<script>
function goIndex() {
    window.location.href = 'trangchu.html';
}

function openFB(btn) {
    const item = btn.closest('.support-card');
    const url = item.getAttribute('data-fb');
    if (url) window.open(url, '_blank');
}

function copyLink(btn) {
    const item = btn.closest('.support-card');
    const url = item.getAttribute('data-fb');
    if (url) {
        navigator.clipboard.writeText(url).then(() => {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check" style="color:#10b981"></i> Đã Chép';
            setTimeout(() => btn.innerHTML = originalHTML, 1500);
        }).catch(() => {
            alert('Không thể sao chép liên kết!');
        });
    }
}

// Chống click chuột phải & phím tắt soi code cơ bản
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase()))) {
        e.preventDefault();
    }
});
</script>

</body>
</html>
