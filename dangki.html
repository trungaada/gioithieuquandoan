<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đăng ký Clan TF</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --accent:#ff3d00;
  --bg:#0f1724;
  --card:#161e2f;
  --text:#e6eef8;
  --text-muted:#b3bcc8;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; }
input, select, textarea { -webkit-user-select:auto; user-select:auto; }

html, body { height:100dvh; height:100%; }

body {
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:20px;
  background-image:url('logo.jpg'); background-size:cover; background-position:center; background-repeat:no-repeat; background-attachment:fixed;
  color:var(--text); position:relative;
  overflow-x:hidden;
}
body::before {
  content:""; position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.4); z-index:0;
}

.page-content {
  width:100%; max-width:420px;
  display:flex; flex-direction:column; align-items:center;
  opacity:0; animation:fadeIn 0.8s ease-out 0.3s forwards;
  z-index:1;
}

h1 {
  font-family:'Orbitron',sans-serif; color:var(--accent); text-transform:uppercase;
  margin-bottom:10px; font-size:2rem; text-align:center;
  text-shadow:0 0 5px var(--accent),0 0 10px var(--accent),0 0 20px rgba(255,61,0,0.6);
  transition:text-shadow 0.3s ease;
}
h1:hover {
  text-shadow:0 0 8px #fff,0 0 15px var(--accent),0 0 30px rgba(255,61,0,0.8);
}

p { color:var(--text-muted); margin-bottom:20px; text-align:center; }

.buttons {
  display:flex; justify-content:center; flex-wrap:wrap;
  gap:12px; margin-bottom:20px;
}
button.group-btn {
  background:var(--accent); color:#fff; border:none; border-radius:8px;
  padding:10px 18px; font-weight:700; font-size:0.9rem;
  cursor:pointer; text-transform:uppercase; transition:0.3s;
}
button.group-btn:hover { background:#ff1744; transform:scale(1.05); box-shadow:0 4px 15px rgba(255,61,0,0.5); }
button.group-btn:active { transform:scale(0.97); }
button.group-btn.highlight { animation:pulseGlow 1.5s ease-in-out infinite; }

form {
  width:100%; max-width:400px;
  background:rgba(22,30,47,0.75);
  backdrop-filter:blur(8px);
  padding:20px; border-radius:12px;
  border:2px solid var(--accent);
  box-shadow:0 0 15px rgba(255,61,0,0.6);
  margin-bottom:20px;
  display:none; opacity:0; visibility:hidden;
  transition:opacity 0.3s ease, visibility 0.3s ease;
}
form.active { display:block; opacity:1; visibility:visible; }

form h2 {
  color:var(--accent); text-align:center;
  margin-bottom:15px; text-shadow:0 0 3px var(--accent);
}

label { font-weight:600; margin-bottom:6px; display:block; }
input, select, textarea {
  width:100%; padding:10px; margin-bottom:15px;
  border:2px solid #333; border-radius:6px;
  background:#1e293b; color:var(--text);
  transition:0.3s;
  scroll-margin-top: 20px;
}
input:focus, select:focus {
  border-color:red;
  animation:rainbowBorder 1.5s linear infinite;
  box-shadow:0 0 10px rgba(255,255,255,0.7);
  transform:scale(1.02);
}

button.submit-btn {
  background:var(--accent); color:#fff;
  border:none; border-radius:8px;
  padding:12px 20px; font-weight:700; font-size:1rem;
  cursor:pointer; width:100%; text-transform:uppercase;
}
button.submit-btn:hover { background:#ff1744; }

button.close-btn {
  background:none; border:none; font-size:1.2rem; cursor:pointer;
  position:absolute; right:10px; top:10px; color:white;
}
button.close-btn:hover { color:red; }

.message { min-height:24px; margin-bottom:10px; font-weight:bold; text-align:center; }
.success { color:#4CAF50; }
.error { color:#f44336; }
.loading { color:#ffeb3b; animation:blink 1s infinite; }

@keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1;} }
@keyframes rainbowBorder {
  0%{border-color:red;} 14%{border-color:orange;} 28%{border-color:yellow;}
  42%{border-color:lime;} 57%{border-color:cyan;} 71%{border-color:blue;}
  85%{border-color:magenta;} 100%{border-color:red;}
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
@keyframes pulseGlow {0%{box-shadow:0 0 0px var(--accent);}50%{box-shadow:0 0 10px var(--accent);}100%{box-shadow:0 0 0px var(--accent);} }

@media(max-width:480px){
  .page-content{ max-width:360px; }
  form{ padding:15px; }
  h1{ font-size:1.8rem; }
  input, select{ padding:8px; font-size:0.85rem; }
}

#sakuraCanvas{
  position:fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:0;
}
</style>
</head>

<body>
<div class="page-content">
<h1>Đăng ký Clan TF</h1>
<p>Chọn nhóm muốn gia nhập và điền thông tin!</p>

<div class="buttons">
  <button class="group-btn" onclick="showForm('sinhTonForm')">1️⃣ Sinh Tồn</button>
  <button class="group-btn" onclick="showForm('soloForm')">2️⃣ Solo Tử Chiến</button>
  <button class="group-btn" onclick="window.location.href='index.html'">🔙 Trang Chủ</button>
  <button class="group-btn" onclick="window.location.href='hotro.html'">❓ Hỗ Trợ</button>
</div>

<form id="sinhTonForm">
  <h2>🔥 Nhóm Sinh Tồn <button class="close-btn" onclick="hideForms()">❌</button></h2>

  <input type="hidden" name="entry.group" value="Sinh Tồn">

  <label>Tên trong game:</label>
  <input type="text" name="entry.name" required>

  <label>UID:</label>
  <input type="text" name="entry.uid" required>

  <label>Rank hiện tại:</label>
  <select name="entry.rank" required>
    <option value="">-- Chọn Rank --</option>
    <option>Đồng</option><option>Bạc</option><option>Vàng</option>
    <option>Bạch Kim</option><option>Kim Cương</option>
    <option>Huyền Thoại</option><option>Cao Thủ</option>
    <option>Đại Cao Thủ</option><option>Top Sever</option>
  </select>

  <label>Vai trò mong muốn:</label>
  <select name="entry.role" required>
    <option value="">-- Chọn Vai Trò --</option>
    <option>Rush</option><option>Cover</option>
    <option>Sniper</option><option>Hỗ trợ</option>
  </select>

  <label>Tuổi:</label>
  <input type="number" name="entry.age" min="14" max="30" required>

  <label>Giới tính:</label>
  <select name="entry.gender" required>
    <option value="">-- Chọn Giới Tính --</option>
    <option>Nam</option><option>Nữ</option><option>Khác</option>
  </select>

  <label>Tên Facebook:</label>
  <input type="text" name="entry.fb_name" required>

  <label>Link Facebook:</label>
  <input type="url" name="entry.facebook" required>

  <label>Khung giờ:</label>
  <select name="entry.time" required>
    <option value="">-- Chọn khung giờ --</option>
    <option>18h – 20h</option><option>19h – 21h</option>
    <option>20h – 22h</option><option>21h – 23h</option><option>Cả ngày</option>
  </select>

  <div class="message" id="msg-sinhTonForm"></div>
  <button type="submit" class="submit-btn">🚀 Gửi đăng ký</button>
</form>

<form id="soloForm">
  <h2>⚡ Solo Tử Chiến <button class="close-btn" onclick="hideForms()">❌</button></h2>

  <input type="hidden" name="entry.group" value="Solo Tử Chiến">

  <label>Tên trong game:</label>
  <input type="text" name="entry.name" required>

  <label>UID:</label>
  <input type="text" name="entry.uid" required>

  <label>Rank hiện tại:</label>
  <select name="entry.rank" required>
    <option value="">-- Chọn Rank --</option>
    <option>Đồng</option><option>Bạc</option><option>Vàng</option>
    <option>Bạch Kim</option><option>Kim Cương</option>
    <option>Huyền Thoại</option><option>Cao Thủ</option>
    <option>Đại Cao Thủ</option><option>Top Sever</option>
  </select>

  <label>Vai trò:</label>
  <select name="entry.role" required>
    <option value="">-- Chọn Vai Trò --</option>
    <option>Kai 2</option><option>Kai 5</option>
    <option>Headshot Kai 2</option><option>Headshot Kai 5</option>
  </select>

  <label>Tuổi:</label>
  <input type="number" name="entry.age" min="14" max="30" required>

  <label>Giới tính:</label>
  <select name="entry.gender" required>
    <option value="">-- Chọn Giới Tính --</option>
    <option>Nam</option><option>Nữ</option><option>Khác</option>
  </select>

  <label>Tên Facebook:</label>
  <input type="text" name="entry.fb_name" required>

  <label>Link Facebook:</label>
  <input type="url" name="entry.facebook" required>

  <label>Khung giờ:</label>
  <select name="entry.time" required>
    <option value="">-- Chọn khung giờ --</option>
    <option>18h – 20h</option><option>19h – 21h</option>
    <option>20h – 22h</option><option>21h – 23h</option><option>Cả ngày</option>
  </select>

  <div class="message" id="msg-soloForm"></div>
  <button type="submit" class="submit-btn">🚀 Gửi đăng ký</button>
</form>

<canvas id="sakuraCanvas"></canvas>
</div>

<script>
const canvas=document.getElementById('sakuraCanvas');
const ctx=canvas.getContext('2d');
let W=canvas.width=innerWidth;
let H=canvas.height=innerHeight;
let PETAL_COUNT=innerWidth<=768?10:30;
let petals=[];
const random=(a,b)=>Math.random()*(b-a)+a;

function init(){
  petals=[];
  for(let i=0;i<PETAL_COUNT;i++){
    petals.push({
      x:random(0,W), y:random(0,H),
      r:random(5,12), d:random(1,3),
      swing:random(0,2*Math.PI), s:random(0.01,0.03),
      color:"rgba(255,182,193,0.8)"
    });
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  petals.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
    p.y+=p.d; p.x+=Math.sin(p.swing)*2; p.swing+=p.s;
    if(p.y>H)p.y=-10,p.x=random(0,W);
  });
  requestAnimationFrame(draw);
}

onresize=()=>{ W=canvas.width=innerWidth; H=canvas.height=innerHeight; init(); };
init(); draw();

window.hideForms=()=>{
  sinhTonForm.classList.remove("active");
  soloForm.classList.remove("active");
};
window.showForm=id=>{
  hideForms();
  document.getElementById(id).classList.add("active");
};

const WEB_APP_URL="https://script.google.com/macros/s/AKfycbzlLo4thOVaMP9tcEHfJuXOPSHsYShEUUq7yosVYKzxC6UnBu_G_TkxPqEtXvk8d9s2/exec";

function validURL(u){
  try{
    let x=new URL(u);
    return x.protocol==="http:"||x.protocol==="https:";
  }catch{ return false; }
}

function submitForm(formId){
  const form=document.getElementById(formId);
  form.addEventListener("submit",e=>{
    e.preventDefault();
    const msg=document.getElementById("msg-"+formId);
    const fd=new FormData(form);
    const age=+fd.get("entry.age");
    const fb=fd.get("entry.facebook");

    if(age<14||age>30){ msg.textContent="Tuổi 14 - 30"; msg.className="message error"; return; }
    if(!validURL(fb)){ msg.textContent="Link Facebook không hợp lệ"; msg.className="message error"; return; }

    msg.textContent="Đang gửi..."; msg.className="message loading";

    fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",body:fd})
    .then(()=>{ msg.textContent="Đăng ký thành công!"; msg.className="message success"; form.reset(); })
    .catch(()=>{ msg.textContent="Gửi thất bại!"; msg.className="message error"; });
  });
}

submitForm("sinhTonForm");
submitForm("soloForm");

onload=()=>{
  let btns=document.querySelectorAll(".group-btn");
  btns.forEach(b=>b.classList.add("highlight"));
  setTimeout(()=>btns.forEach(b=>b.classList.remove("highlight")),3000);
};

function focusHandler(e) {
  const element = e.target;
  if (element.tagName === 'INPUT' || element.tagName === 'SELECT' || element.tagName === 'TEXTAREA') {
    setTimeout(() => {
      element.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
      window.scrollBy(0, -20);
    }, 350);
  }
}

document.body.addEventListener('focus', focusHandler, true);


/* ----------------------------------------
   ĐẨY NGUYÊN TRANG LÊN KHI BẤM VÀO Ô NHẬP
-----------------------------------------*/
function pageLiftOnFocus() {
  const fields = document.querySelectorAll("input, select, textarea");

  fields.forEach(el => {
    el.addEventListener("focus", () => {
      document.body.style.transform = "translateY(-120px)"; // đẩy trang lên 120px
      document.body.style.transition = "0.3s ease";
    });

    el.addEventListener("blur", () => {
      document.body.style.transform = "translateY(0)"; // trả về vị trí bình thường
    });
  });
}

pageLiftOnFocus();


</script>
</body>
</html>
