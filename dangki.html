<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký Clan TF</title>
<style>
:root {
  --accent:#ff3d00;
  --bg:#0f1724;
  --card:#161e2f;
  --text:#e6eef8;
  --text-muted:#b3bcc8;
  --form-bg-opacity: 0.95;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; font-family:'Montserrat',sans-serif; }
body{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  min-height:100vh; padding:20px;
  background-image:url('logo.jpg'); background-size:cover; background-position:center; background-repeat:no-repeat; background-attachment:fixed;
  color:var(--text); position:relative;
}
body::before{
  content:""; position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.5);
  z-index:0;
}
.page-content{
  width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center;
  animation:fadeIn 0.8s ease-out forwards; opacity:0; animation-delay:0.3s;
}
h1{
  font-family:'Orbitron',sans-serif; color:var(--accent); text-transform:uppercase; margin-bottom:10px; font-size:2rem; text-align:center; z-index:1;
  text-shadow: 0 0 5px rgba(255, 61, 0, 0.7);
}
p{ color:var(--text-muted); margin-bottom:20px; font-size:1rem; text-align:center; z-index:1; }
.buttons{ display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; z-index:1; }
button.group-btn{ background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-weight:700; font-size:0.9rem; cursor:pointer; transition:0.3s; }
button.group-btn:hover{ background:#ff1744; transform:scale(1.05); }
button.group-btn.highlight { animation: pulseGlow 1.5s ease-in-out infinite; }
form{
  width:100%; max-width:350px;
  background:rgba(22,30,47,var(--form-bg-opacity));
  padding:25px;
  border-radius:16px;
  border:2px solid var(--accent);
  box-shadow:0 0 20px rgba(255,61,0,0.6), inset 0 0 5px rgba(255,255,255,0.1);
  text-align:left; display:none; z-index:1;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
form.active{ display:block; }
form h2 {
  color: var(--text); text-align: center; margin-bottom: 20px; text-shadow: 0 0 3px var(--accent);
}
.input-group { position: relative; margin-bottom:20px; }
.input-group input,
.input-group select,
.input-group textarea {
  width: 100%; padding:14px 12px; font-size:1rem; border:1px solid var(--text-muted); border-radius:8px;
  background: rgba(22,30,47,0.9); color:#fff; outline:none;
  transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.input-group select {
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background: rgba(22,30,47,0.9) url("data:image/svg+xml;utf8,<svg fill='%23fff' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>") no-repeat right 10px center;
  background-size: 16px; padding-right:36px; cursor:pointer;
}
.input-group input:focus,
.input-group input:not(:placeholder-shown),
.input-group select:focus,
.input-group select:hover,
.input-group select:valid,
.input-group textarea:focus,
.input-group textarea:not(:placeholder-shown) {
  border-color: var(--accent);
  box-shadow:0 0 8px rgba(255,61,0,0.5);
  background: rgba(22,30,47,0.98);
}
.input-group select option { color:#000; background:#fff; }
.input-group label {
  position: absolute; top:18px; left:12px; transform: translateY(-50%);
  color:var(--text-muted); font-size:1rem; pointer-events:none;
  transition: 0.2s cubic-bezier(0.25,0.8,0.25,1);
  background:transparent; padding:0;
}
.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label,
.input-group textarea:focus + label,
.input-group textarea:not(:placeholder-shown) + label,
.input-group select:focus + label,
.input-group select:valid + label {
  top:-10px; left:10px; font-size:0.85rem; color:var(--accent);
  background: var(--card); padding:0 6px; border-radius:4px;
}
button.submit-btn{
  background:var(--accent); color:#fff; border:none;
  border-radius:10px; padding:14px 20px; font-weight:700; cursor:pointer; width:100%; font-size:1.1rem;
  transition:0.3s; box-shadow:0 4px 10px rgba(255,61,0,0.5);
}
button.submit-btn:hover{ background:#ff1744; transform:scale(1.02); }
.message{ text-align:center; margin-top:5px; min-height:24px; font-weight:bold; font-size:0.95rem; z-index:1; }
.success{ color:#4CAF50; } .error{ color:#f44336; } .loading{ color:#ffeb3b; animation:blink 1s infinite; }

@keyframes fadeIn{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
@keyframes pulseGlow { 0%{box-shadow:0 0 0 var(--accent);} 50%{box-shadow:0 0 15px var(--accent),0 0 30px rgba(255,61,0,0.6);} 100%{box-shadow:0 0 0 var(--accent);} }
@keyframes blink{ 0%,50%,100%{opacity:1;} 25%,75%{opacity:0.3;} }

@media(max-width:480px){
  .page-content{ max-width:90%; }
  form{ padding:20px; }
  h1{ font-size:1.8rem; }
  p{ font-size:1rem; }
  .input-group input, .input-group select, .input-group textarea{ font-size:0.9rem; padding:12px; }
  .input-group label{ font-size:0.9rem; top:16px; }
  .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label,
  .input-group select:focus + label, .input-group select:valid + label{
    font-size:0.75rem; top:-8px; left:8px;
  }
  button.group-btn, button.submit-btn{ font-size:0.95rem; padding:10px 16px; }
}

#sakuraCanvas{ position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
</style>
</head>
<body>

<div class="page-content">
<h1>Đăng ký Clan TF</h1>
<p>Chọn nhóm muốn gia nhập và điền thông tin!</p>

<div class="buttons">
  <button class="group-btn" onclick="showForm('sinhTonForm')">1️⃣ Sinh Tồn</button>
  <button class="group-btn" onclick="showForm('soloForm')">2️⃣ Solo Tử Chiến</button>
  <button class="group-btn" onclick="window.location.href='index.html'">🔙 Trang Chủ</button>
  <button class="group-btn" onclick="window.location.href='hotro.html'">🔙 Hỗ Trợ</button>
</div>

<form id="sinhTonForm">
  <h2>🔥 Nhóm Sinh Tồn</h2>
  <input type="hidden" name="entry.group" value="Sinh Tồn">

  <div class="input-group"><input type="text" name="entry.name" required placeholder=" "><label>Tên trong game:</label></div>
  <div class="input-group"><input type="text" name="entry.uid" required placeholder=" "><label>UID:</label></div>
  <div class="input-group"><select name="entry.rank" required>
    <option value="" disabled selected></option>
    <option>Đồng</option><option>Bạc</option><option>Vàng</option><option>Bạch Kim</option>
    <option>Kim Cương</option><option>Huyền Thoại</option><option>Cao Thủ</option>
    <option>Đại Cao Thủ</option><option>Top Sever</option>
  </select><label>Rank hiện tại:</label></div>
  <div class="input-group"><select name="entry.role" required>
    <option value="" disabled selected></option>
    <option>Rush</option><option>Cover</option><option>Sniper</option><option>Hỗ trợ</option>
  </select><label>Vai trò mong muốn:</label></div>
  <div class="input-group"><input type="number" name="entry.age" min="14" max="30" placeholder=" " required><label>Tuổi:</label></div>
  <div class="input-group"><select name="entry.gender" required>
    <option value="" disabled selected></option>
    <option>Nam</option><option>Nữ</option><option>Khác</option>
  </select><label>Giới tính:</label></div>
  <div class="input-group"><input type="text" name="entry.fb_name" placeholder=" " required><label>Tên Facebook (Bắt Buộc):</label></div>
  <div class="input-group"><input type="url" name="entry.facebook" placeholder=" " required><label>Liên kết Facebook (Bắt Buộc):</label></div>
  <div class="input-group"><select name="entry.time" required>
    <option value="" disabled selected></option>
    <option>18h – 20h</option><option>19h – 21h</option><option>20h – 22h</option>
    <option>21h – 23h</option><option>Cả ngày</option>
  </select><label>Khung thời gian:</label></div>

  <div class="message" id="msg-sinhTonForm"></div>
  <button type="submit" class="submit-btn">🚀 Gửi đăng ký</button>
</form>

<form id="soloForm">
  <h2>⚡ Nhóm Solo Tử Chiến</h2>
  <input type="hidden" name="entry.group" value="Solo Tử Chiến">

  <div class="input-group"><input type="text" name="entry.name" required placeholder=" "><label>Tên trong game:</label></div>
  <div class="input-group"><input type="text" name="entry.uid" required placeholder=" "><label>UID:</label></div>
  <div class="input-group"><select name="entry.rank" required>
    <option value="" disabled selected></option>
    <option>Đồng</option><option>Bạc</option><option>Vàng</option><option>Bạch Kim</option>
    <option>Kim Cương</option><option>Huyền Thoại</option><option>Cao Thủ</option>
    <option>Đại Cao Thủ</option><option>Top Sever</option>
  </select><label>Rank hiện tại:</label></div>
  <div class="input-group"><select name="entry.role" required>
    <option value="" disabled selected></option>
    <option>Kai 2</option><option>Kai 5</option><option>Headshot Kai 2</option><option>Headshot Kai 5</option>
  </select><label>Vai trò mong muốn:</label></div>
  <div class="input-group"><input type="number" name="entry.age" min="14" max="30" placeholder=" " required><label>Tuổi:</label></div>
  <div class="input-group"><select name="entry.gender" required>
    <option value="" disabled selected></option>
    <option>Nam</option><option>Nữ</option><option>Khác</option>
  </select><label>Giới tính:</label></div>
  <div class="input-group"><input type="text" name="entry.fb_name" placeholder=" " required><label>Tên Facebook (Bắt Buộc):</label></div>
  <div class="input-group"><input type="url" name="entry.facebook" placeholder=" " required><label>Liên kết Facebook (Bắt Buộc):</label></div>
  <div class="input-group"><select name="entry.time" required>
    <option value="" disabled selected></option>
    <option>18h – 20h</option><option>19h – 21h</option><option>20h – 22h</option>
    <option>21h – 23h</option><option>Cả ngày</option>
  </select><label>Khung thời gian:</label></div>

  <div class="message" id="msg-soloForm"></div>
  <button type="submit" class="submit-btn">🚀 Gửi đăng ký</button>
</form>

<canvas id="sakuraCanvas"></canvas>

<script>
// Sakura petals
const canvas = document.getElementById('sakuraCanvas');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
const petals = [];
const PETAL_COUNT = 30;
function random(min,max){ return Math.random()*(max-min)+min; }
function initPetals(){
  for(let i=0;i<PETAL_COUNT;i++){
    petals.push({x:random(0,W),y:random(0,H),r:random(5,12),d:random(1,3),swing:random(0,Math.PI*2),swingSpeed:random(0.01,0.03),color:'rgba(255,182,193,0.8)'});
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(let p of petals){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
    p.y+=p.d; p.x+=Math.sin(p.swing)*2; p.swing+=p.swingSpeed;
    if(p.y>H){ p.y=-10; p.x=random(0,W); }
    if(p.x>W) p.x=0; if(p.x<0) p.x=W;
  }
  requestAnimationFrame(draw);
}
window.addEventListener('resize', ()=>{ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; });
initPetals(); draw();

// Show form
function showForm(id){
  document.getElementById('sinhTonForm').classList.remove('active');
  document.getElementById('soloForm').classList.remove('active');
  document.getElementById(id).classList.add('active');
}

// Form submission
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbzlLo4thOVaMP9tcEHfJuXOPSHsYShEUUq7yosVYKzxC6UnBu_G_TkxPqEtXvk8d9s2/exec";
['sinhTonForm','soloForm'].forEach(f=>{
  const form=document.getElementById(f);
  const msg=document.getElementById('msg-'+f);
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data=new FormData(form);
    const age=Number(data.get("entry.age"));
    if(isNaN(age)||age<14||age>30){ msg.innerHTML="<p class='error'>❌ Tuổi phải là số từ 14 đến 30!</p>"; return; }
    msg.innerHTML='<span class="loading">⏳ Đang gửi dữ liệu...</span>';
    try{ await fetch(WEB_APP_URL,{method:"POST",body:data,mode:"no-cors"});
      msg.innerHTML="<p class='success'>✅ Đăng kí thành công!<br>⚡ Thông tin của bạn đang được xét duyệt 😎</p>";
      form.reset();
    }catch(err){ console.error(err); msg.innerHTML="<p class='error'>❌ Gửi thất bại! Hãy thử lại.</p>"; }
  });
});

// Scroll to input on focus
document.querySelectorAll('input, select, textarea').forEach(el=>{
  el.addEventListener('focus', ()=>{
    const rect=el.getBoundingClientRect();
    const scrollTop=window.pageYOffset||document.documentElement.scrollTop;
    const top=rect.top+scrollTop-100;
    window.scrollTo({top, behavior:'smooth'});
  });
});

// Highlight buttons
window.addEventListener('load', ()=>{
  const sinhTonBtn=document.querySelector('button[onclick="showForm(\'sinhTonForm\')"]');
  const soloBtn=document.querySelector('button[onclick="showForm(\'soloForm\')"]');
  setTimeout(()=>{ sinhTonBtn.classList.add('highlight'); soloBtn.classList.add('highlight'); },1000);
  setTimeout(()=>{ sinhTonBtn.classList.remove('highlight'); soloBtn.classList.remove('highlight'); },4000);
});
</script>
</body>
</html>
