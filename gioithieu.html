<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản Trị Quân Đoàn — TitanForce²</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #00e6e6;
    --accent: #00ffaa;
    --red: #ff2e63;
    --gold: #ffd166;
    --glass: rgba(10, 15, 28, 0.9);
    --radius: 18px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
    min-height: 100vh;
    background: #0a0f1c;
    color: #e6eef6;
    font-family: 'Poppins', sans-serif;
    padding: 20px 10px;
    position: relative;
    overflow: hidden; /* Ẩn scroll lúc load */
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ===================== PRELOADER SIÊU CHẤT ===================== */
#preloader {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    justify-content: center;
    transition: opacity 1.5s ease 2.8s, visibility 0s 4.3s;
}
#preloader.remove {
    opacity: 0;
    visibility: hidden;
}

/* Logo khởi động */
.preloader-logo {
    width: 130px;
    height: 130px;
    background: url('logo2.jpg') center/cover no-repeat;
    border-radius: 50%;
    border: 5px solid transparent;
    box-shadow: 0 0 40px rgba(0,230,230,0.8);
    animation: logoStart 4s ease-in-out;
}
@keyframes logoStart {
    0%   { transform: scale(0) rotate(0deg); box-shadow: 0 0 0 rgba(0,230,230,0); }
    50%  { transform: scale(1.3) rotate(180deg); box-shadow: 0 0 100px rgba(0,230,230,1); }
    100% { transform: scale(1) rotate(360deg); box-shadow: 0 0 40px rgba(0,230,230,.8); }
}

/* Chữ TITANFORCE² glitch */
.preloader-title {
    margin-top: 40px;
    font-size: 3.2rem;
    font-weight: 800;
    letter-spacing: 10px;
    color: #00e6e6;
    text-shadow: 0 0 30px #00e6e6;
    animation: glitch 3s linear forwards;
    opacity: 0;
}
@keyframes glitch {
    0%   { opacity: 0; transform: translateY(50px); }
    20%  { opacity: 1; transform: translateY(0); }
    25%  { clip-path: polygon(0 0, 100% 0, 100% 40%, 0 60%); }
    30%  { clip-path: polygon(0 30%, 100% 0, 100% 70%, 0 100%); }
    60%  { opacity: 1; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
    100% { opacity: 1; text-shadow: 0 0 60px #00ffaa, 0 0 100px #00e6e6; }
}

/* Đường scan quét xuống */
.scan-effect {
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 4px;
    background: var(--accent);
    box-shadow: 0 0 40px var(--accent), 0 0 80px #00ffff;
    animation: scanDown 2.5s ease-in-out forwards;
}
@keyframes scanDown {
    0%   { top: -100%; }
    80%  { top: 100%; }
    100% { top: 100%; }
}

/* Nội dung chính ẩn lúc đầu */
.main-content {
    opacity: 0;
    transform: translateY(50px);
    transition: opacity 1.8s ease 3.5s, transform 1.8s ease 3.5s;
}
.main-content.show {
    opacity: 1;
    transform: translateY(0);
}

/* Background gốc của bạn */
.bg-animation {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: 
        radial-gradient(circle at 20% 80%, rgba(0,230,230,0.15), transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0,255,170,0.15), transparent 50%),
        linear-gradient(45deg, #0a0f1c 25%, transparent 25%),
        linear-gradient(-45deg, #0a0f1c 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #0f1a2c 75%),
        linear-gradient(-45deg, transparent 75%, #0f1a2c 75%);
    background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px, 60px 60px, 60px 60px;
    background-position: 0 0, 0 0, 0 0, 30px 30px, 30px 30px, 0 30px;
    animation: waveMove 30s linear infinite;
}
@keyframes waveMove {
    0% { background-position: 0 0, 0 0, 0 0, 30px 30px, 30px 30px, 0 30px; }
    100% { background-position: 600px 600px, -600px -600px, 600px 0, 630px 630px, 630px 630px, 600px 630px; }
}

/* Hạt sáng + scanline */
.particles span {
    position: fixed;
    background: var(--primary);
    border-radius: 50%;
    pointer-events: none;
    animation: floatParticle linear infinite;
    z-index: -2;
}
@keyframes floatParticle {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
}

.scanline {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, transparent, rgba(0,255,170,0.5), transparent);
    box-shadow: 0 0 20px rgba(0,255,170,0.8);
    animation: scan 10s linear infinite;
    z-index: -1;
}
@keyframes scan { 0% { transform: translateY(-100px); } 100% { transform: translateY(110vh); } }

/* Phần nội dung giữ nguyên 100% như cũ */
.container { max-width: 780px; width: 100%; text-align:center; z-index:2; }

.logo-container img {
    width: clamp(70px, 18vw, 110px);
    height: clamp(70px, 18vw, 110px);
    border-radius: 50%;
    border: 3px solid var(--primary);
    box-shadow: 0 0 25px rgba(0,230,230,0.5);
}

h1#typing-title {
    font-size: clamp(1.8rem, 5.5vw, 3.2rem);
    font-weight: 800;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 14px 0 6px;
    letter-spacing: 2px;
}

.lead { font-size: clamp(0.9rem, 2.8vw, 1.15rem); color: #a0e0e0; margin-bottom: 40px; }

.members {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px;
    max-width: 720px;
    margin: 0 auto 50px;
}

.card { background: var(--glass); padding: 24px 18px; border-radius: var(--radius); border: 1px solid rgba(0,230,230,0.2); backdrop-filter: blur(16px); box-shadow: 0 8px 25px rgba(0,0,0,0.5); transition: all 0.5s ease; position: relative; }
.card:hover { transform: translateY(-10px); box-shadow: 0 18px 45px rgba(0,0,0,0.6), 0 0 40px rgba(0,230,230,0.25); }
.card::before { content: ''; position: absolute; inset: -2px; border-radius: var(--radius); background: linear-gradient(45deg, var(--primary), var(--accent)); filter: blur(8px); opacity: 0; transition: opacity 0.5s; }
.card:hover::before { opacity: 0.7; }

.avatar { width: 90px; height: 90px; margin: 0 auto 16px; border-radius: 50%; background-size: cover !important; background-position: center !important; border: 4px solid var(--red); box-shadow: 0 0 25px rgba(255,46,99,0.6); transition: 0.6s; }
.card:hover .avatar { transform: scale(1.18); }

h2 { font-size: 1.25rem; color: var(--red); text-shadow: 0 0 10px rgba(255,46,99,0.7); margin: 8px 0; }
.role { font-size: 1rem; color: var(--gold); font-weight: 600; margin-bottom: 16px; }
.badge { padding: 5px 14px; background: rgba(0,255,170,0.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 25px; font-size: 0.78rem; }
.card:hover .badge { background: var(--accent); color: #000; }

#backButton {
    padding: 10px 32px;
    background: rgba(0,230,230,0.15);
    border: 1.5px solid var(--primary);
    color: var(--primary);
    border-radius: 40px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    transition: 0.4s;
}
#backButton:hover { background: var(--primary); color: #000; transform: scale(1.08); }
</style>
</head>
<body>

<!-- PRELOADER MỚI -->
<div id="preloader">
    <div class="preloader-logo"></div>
    <div class="preloader-title">TITANFORCE²</div>
    <div class="scan-effect"></div>
</div>

<!-- Background gốc -->
<div class="bg-animation"></div>
<div class="particles"></div>
<div class="scanline"></div>

<!-- Nội dung chính -->
<div class="main-content">
    <div class="container">
        <div class="logo-container">
            <img src="logo2.jpg" alt="TF Logo">
        </div>
        <h1 id="typing-title"></h1>
        <p class="lead">TITANFORCE² – SỨC MẠNH VÔ ĐỊCH</p>

        <section class="members">
            <div class="card">
                <div class="avatar" style="background-image:url('trung1.jpg')"></div>
                <h2> <span id="name-trung"></span></h2>
                <p class="role" id="role-trung"></p>
                <div class="badges">
                    <span class="badge">Lãnh đạo tối cao</span>
                    <span class="badge">Chiến thuật gia</span>
                </div>
            </div>

            <div class="card">
                <div class="avatar" style="background-image:url('huy.jpg')"></div>
                <h2> <span id="name-tv2"></span></h2>
                <p class="role" id="role-tv2"></p>
                <div class="badges">
                    <span class="badge">Phó chỉ huy</span>
                    <span class="badge">Chiến lược gia</span>
                </div>
            </div>
        </section>

        <a id="backButton" href="trangchu.html">← Quay lại trang chủ</a>
    </div>
</div>

<script>
// Xóa preloader + hiện nội dung sau ~4 giây
setTimeout(() => {
    document.getElementById('preloader').classList.add('remove');
    document.querySelector('.main-content').classList.add('show');
    document.body.style.overflow = 'visible';
}, 3800);

// Bắt đầu typing tiêu đề sau khi load xong
setTimeout(() => {
    const title = "QUẢN TRỊ QUÂN ĐOÀN";
    let i = 0;
    const el = document.getElementById("typing-title");
    function type() {
        if (i < title.length) {
            el.textContent += title.charAt(i++);
            setTimeout(type, 130);
        }
    }
    type();
}, 4200);

// Typing tên + role (giữ nguyên logic cũ)
const data = [
    {id:"name-trung", text:"(TF.Kuronami)"},
    {id:"role-trung", text:"Chỉ huy N2"},
    {id:"name-tv2", text:"(TF.Huy)"},
    {id:"role-tv2", text:"Chỉ huy N1"}
];
(async () => {
    while(true) {
        for (let item of data) {
            let e = document.getElementById(item.id);
            e.textContent = "";
            for (let c of item.text) {
                e.textContent += c;
                await new Promise(r => setTimeout(r, 100));
            }
            await new Promise(r => setTimeout(r, 2000));
        }
        await new Promise(r => setTimeout(r, 6000));
    }
})();

// Tạo 50 hạt sáng
const container = document.querySelector('.particles');
for (let i = 0; i < 50; i++) {
    const p = document.createElement('span');
    p.style.width = p.style.height = Math.random() * 4 + 2 + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = Math.random() * 20 + 15 + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.opacity = Math.random() * 0.6 + 0.4;
    container.appendChild(p);
}
</script>
</body>
</html>
