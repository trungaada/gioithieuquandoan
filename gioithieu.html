<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Quản Trị Quân Đoàn — TitanForce²</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #00e6e6;
    --accent: #00ffaa;
    --red: #ff2e63;
    --gold: #ffd166;
    --glass: rgba(10, 15, 28, 0.92);
    --radius: 18px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
    min-height: 100vh;
    background: #0a0f1c;
    color: #e6eef6;
    font-family: 'Poppins', sans-serif;
    padding: 20px 15px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ===================== BACKGROUND ĐẸP MAX + KHÔNG LAG TRÊN MOBILE ===================== */
/* Desktop & tablet: full hiệu ứng | Mobile: nhẹ hơn nhưng vẫn đẹp */
.bg-animation {
    position: fixed; inset: 0; z-index: -3;
    background: 
        radial-gradient(circle at 20% 80%, rgba(0,230,230,0.18), transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0,255,170,0.18), transparent 50%),
        linear-gradient(45deg, #0a0f1c 25%, transparent 25%),
        linear-gradient(-45deg, #0a0f1c 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #0f1a2c 75%),
        linear-gradient(-45deg, transparent 75%, #0f1a2c 75%);
    background-size: 60px 60px;
    will-change: transform;
}

/* Chỉ bật animation trên màn hình lớn hoặc máy mạnh */
@media (min-width: 768px) {
    .bg-animation {
        animation: waveMove 45s linear infinite;
    }
}
@keyframes waveMove {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(60px, 60px) rotate(1deg); }
}

/* Particle chỉ bật trên màn hình lớn */
.particles span {
    position: fixed;
    background: var(--primary);
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
    opacity: 0;
    z-index: -2;
}
@media (min-width: 768px) {
    .particles.active span { animation: floatParticle linear infinite; }
}
@keyframes floatParticle {
    0%   { transform: translateY(110vh) scale(0); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.7; }
    100% { transform: translateY(-120px) scale(1); opacity: 0; }
}

/* Scanline chỉ hiện trên desktop/tablet */
.scanline {
    position: fixed;
    top: -100px; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, transparent, rgba(0,255,170,0.6), transparent);
    box-shadow: 0 0 30px rgba(0,255,170,0.9);
    will-change: transform;
    opacity: 0;
    pointer-events: none;
}
@media (min-width: 768px) {
    .scanline.active {
        opacity: 1;
        animation: scan 18s linear infinite;
    }
}
@keyframes scan { 0% { transform: translateY(-100px); } 100% { transform: translateY(110vh); } }

/* Card siêu tối ưu */
.card {
    background: var(--glass);
    padding: 28px 20px;
    border-radius: var(--radius);
    border: 1px solid rgba(0,230,230,0.2);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition: transform 0.4s ease;
    content-visibility: auto;
    contain-intrinsic-size: 340px 520px;
}
.card:hover { transform: translateY(-12px); }

/* Tắt hover effect trên thiết bị cảm ứng */
@media (hover: none) and (pointer: coarse) {
    .card:hover { transform: none; }
    .card:hover .avatar { transform: none !important; }
    .card:hover .badge { transform: none !important; }
}

/* Phần còn lại giữ nguyên đẹp */
.container { width: 100%; text-align: center; padding: 0 10px; }
.logo-container img { width: clamp(80px, 20vw, 120px); height: clamp(80px, 20vw, 120px); border-radius: 50%; border: 3px solid var(--primary); box-shadow: 0 0 30px rgba(0,230,230,0.6); object-fit: cover; }
h1#typing-title { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; background: linear-gradient(90deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin: 16px 0 8px; letter-spacing: 3px; }
.lead { font-size: clamp(1rem, 3.5vw, 1.3rem); color: #a0e0e0; margin-bottom: 50px; line-height: 1.6; }
.members { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 780px; margin: 0 auto 60px; padding: 0 10px; }
.avatar { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%; background-size: cover !important; background-position: center !important; border: 4px solid var(--red); box-shadow: 0 0 30px rgba(255,46,99,0.7); transition: transform 0.5s ease; }
.card:hover .avatar { transform: scale(1.18); }
h2 { font-size: 1.35rem; color: var(--red); text-shadow: 0 0 12px rgba(255,46,99,0.8); margin: 10px 0; }
.role { font-size: 1.05rem; color: var(--gold); font-weight: 600; margin-bottom: 18px; }
.badge { padding: 6px 16px; background: rgba(0,255,170,0.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 25px; font-size: 0.82rem; margin: 4px; display: inline-block; transition: all 0.3s; }
.card:hover .badge { background: var(--accent); color: #000; transform: scale(1.1); }
#backButton { display: inline-block; padding: 12px 38px; background: rgba(0,230,230,0.15); border: 2px solid var(--primary); color: var(--primary); border-radius: 50px; font-weight: 700; font-size: 1rem; text-decoration: none; transition: all 0.4s ease; margin-top: 20px; }
#backButton:hover { background: var(--primary); color: #000; transform: scale(1.1); box-shadow: 0 0 35px rgba(0,230,230,0.7); }

/* Preloader đẹp nhưng nhanh */
#preloader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.2s ease 2.2s; }
#preloader.remove { opacity: 0; pointer-events: none; }
.preloader-logo { width: 120px; height: 120px; background: url('logo2.jpg') center/cover no-repeat; border-radius: 50%; border: 5px solid transparent; box-shadow: 0 0 40px rgba(0,230,230,0.8); animation: logoStart 3.6s ease-in-out; }
@keyframes logoStart { 0% { transform: scale(0) rotate(0deg); } 50% { transform: scale(1.3) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }
.preloader-title { margin-top: 40px; font-size: 3rem; font-weight: 800; letter-spacing: 10px; color: #00e6e6; text-shadow: 0 0 30px #00e6e6; animation: glitch 3s linear forwards; opacity: 0; }
@keyframes glitch { 0%{opacity:0;transform:translateY(50px)} 20%{opacity:1;transform:translateY(0)} 100%{opacity:1;text-shadow:0 0 60px #00ffaa} }
.main-content { opacity: 0; transform: translateY(40px); transition: opacity 1.2s ease 2.8s, transform 1.2s ease 2.8s; width: 100%; max-width: 800px; margin: 0 auto; padding: 0 10px; }
.main-content.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div id="preloader">
    <div class="preloader-logo"></div>
    <div class="preloader-title">TITANFORCE²</div>
</div>

<div class="bg-animation"></div>
<div class="particles"></div>
<div class="scanline"></div>

<div class="main-content">
    <div class="container">
        <div class="logo-container"><img src="logo2.jpg" alt="Logo"></div>
        <h1 id="typing-title"></h1>
        <p class="lead">Đội ngũ quản trị Quân Đoàn TitanForce²</p>

        <div class="members">
            <div class="card">
                <div class="avatar" style="background: url('trung.jpg') center/cover no-repeat;"></div>
                <h2 id="name-trung"></h2>
                <p class="role" id="role-trung"></p>
                <div><span class="badge">Chỉ Huy Tối Cao</span><span class="badge">Founder</span></div>
            </div>
            <div class="card">
                <div class="avatar" style="background: url('huy.jpg') center/cover no-repeat;"></div>
                <h2 id="name-tv2"></h2>
                <p class="role" id="role-tv2"></p>
                <div><span class="badge">Phó Chỉ Huy</span><span class="badge">Quản Lý Nội Bộ</span></div>
            </div>
        </div>

        <a href="index.html" id="backButton">← Quay Lại Trang Chủ</a>
    </div>
</div>

<script>
// Preloader & show content
setTimeout(() => {
    document.getElementById('preloader').classList.add('remove');
    document.querySelector('.main-content').classList.add('show');
}, 3400);

// Typing title
setTimeout(() => {
    const title = "QUẢN TRỊ QUÂN ĐOÀN";
    let i = 0;
    const el = document.getElementById("typing-title");
    const type = () => { if (i < title.length) { el.textContent += title.charAt(i++); setTimeout(type, 120); } };
    type();
}, 3600);

// Typing tên + role
const data = [ {id:"name-trung", text:"(TF.Kuronami)"}, {id:"role-trung", text:"Chỉ huy N2"}, {id:"name-tv2", text:"(TF.Huy)"}, {id:"role-tv2", text:"Chỉ huy N1"} ];
(async () => {
    while(true) {
        for (let item of data) {
            let e = document.getElementById(item.id);
            e.textContent = "";
            for (let c of item.text) { e.textContent += c; await new Promise(r => setTimeout(r, 90)); }
            await new Promise(r => setTimeout(r, 2200));
        }
        await new Promise(r => setTimeout(r, 5000));
    }
})();

// Chỉ bật particle + scanline trên màn hình lớn (tự động detect)
if (window.innerWidth >= 768) {
    // Particle nhẹ (chỉ 22 cái)
    for (let i = 0; i < 22; i++) {
        const p = document.createElement('span');
        const size = Math.random() * 4 + 2;
        const duration = Math.random() * 25 + 25;
        const delay = Math.random() * 15;
        p.style.width = p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = duration + 's';
        p.style.animationDelay = delay + 's';
        p.style.opacity = Math.random() * 0.6 + 0.3;
        document.querySelector('.particles').appendChild(p);
    }
    document.querySelector('.particles').classList.add('active');
    document.querySelector('.scanline').classList.add('active');
}
</script>
</body>
</html>
