<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ Chào bạn đến với thế giới của chúng mình ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --pink: #ff69b4;
    --purple: #9d4edd;
    --bg-start: #1e0d38;
    --bg-end: #2d1b4e;
    --glass: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.18);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family:'Poppins',sans-serif; color:#fff; }

body {
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,var(--bg-start),var(--bg-end));
    -webkit-font-smoothing: antialiased;
}

/* Particles canvas */
#particles { position:fixed; inset:0; z-index:1; pointer-events:none; }

/* Loading */
#loading { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:999; background: linear-gradient(135deg,var(--bg-start),var(--bg-end)); transition:opacity 1s; }
#loading h1 { font-size:clamp(1.8rem,5vw,2.6rem); background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:1.5rem; font-weight:600; }
.spinner { width:56px; height:56px; border:5px solid rgba(255,105,180,0.2); border-top-color: var(--pink); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loaded { opacity:0; pointer-events:none; }

/* Form Box */
#formBox {
    max-width:440px; width:92%; padding:48px 36px;
    background:var(--glass); backdrop-filter:blur(20px);
    border-radius:28px; border:1px solid var(--glass-border);
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    text-align:center; position:relative; z-index:10;
    opacity:0; transform:translateY(30px); transition:all 0.9s cubic-bezier(0.34,1.56,0.64,1); display:none;
}
#formBox.visible { opacity:1; transform:translateY(0); display:block; }
@media(min-width:768px) {
    #formBox::before { content:''; position:absolute; inset:-4px; background:conic-gradient(from 0deg,var(--pink),var(--purple),var(--pink)); border-radius:32px; z-index:-1; animation:rotate 20s linear infinite; opacity:0.4; filter:blur(8px);}
}
@keyframes rotate { to { transform:rotate(360deg); } }

h2 { font-size:clamp(1.9rem,5vw,2.2rem); background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px; font-weight:600; }
#formBox p { color:#e0d0ff; margin-bottom:2rem; font-size:1rem; }

input,#captchaQuestion { width:100%; padding:16px 20px; margin:12px 0; border-radius:50px; outline:none; transition:all 0.3s; font-size:1.05rem; }
input { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.2); color:#fff; }
input::placeholder { color:#ccc; opacity:0.8; }
input:focus { background:rgba(255,255,255,0.25); border-color:var(--pink); box-shadow:0 0 20px rgba(255,105,180,0.3); }

#captchaContainer { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin:20px 0; }
#captchaQuestion { background: rgba(157,78,221,0.25); font-weight:600; font-size:1.2rem; text-align:center; }
#refreshCaptchaButton { width:48px; height:48px; background:rgba(255,255,255,0.15); border:none; border-radius:50%; font-size:1.4rem; color:var(--pink); cursor:pointer; transition:all 0.4s; }
#refreshCaptchaButton:hover { background:var(--pink); color:#fff; transform:rotate(360deg); }

.captcha-error { color:#ffb3d1; font-size:0.9rem; margin-top:8px; opacity:0; transition:opacity 0.3s; }
.captcha-error.show { opacity:1; }

button#submitButton {
    width:100%; padding:18px; margin-top:24px; border:none; border-radius:50px; color:white; font-size:1.15rem; font-weight:600; cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--purple)); box-shadow:0 10px 30px rgba(255,105,180,0.35); transition:all 0.4s;
}
button#submitButton:hover:not(:disabled), button#submitButton:active:not(:disabled) { transform:translateY(-4px); box-shadow:0 15px 40px rgba(255,105,180,0.5);}
button#submitButton:disabled { background:#666; cursor:not-allowed; transform:none; box-shadow:none; }

#formLoadingOverlay,#pageTransitionOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); color:#fff; font-size:1.5rem; z-index:9999; align-items:center; justify-content:center; text-align:center; flex-direction:column; }
#formLoadingOverlay.show,#pageTransitionOverlay.show-transition { display:flex; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div id="loading">
    <h1> Xin vui lòng đợi một chút... </h1>
    <div class="spinner"></div>
</div>

<div id="formBox">
    <h2>Nhập tên của bạn nào!</h2>
    <p>Để vào trang chủ nha~</p>

    <form id="nameForm">
        <input type="text" id="nameInput" placeholder="Tên của bạn là gì?" required autocomplete="off">
        <div id="captchaContainer">
            <div id="captchaQuestion">? ? ?</div>
            <button type="button" id="refreshCaptchaButton">↻</button>
            <input type="number" id="captchaInput" placeholder="= ?">
        </div>
        <p class="captcha-error" id="captchaError">Oops~ Sai rồi, thử lại nha ❤️</p>
        <button type="submit" id="submitButton" disabled>Vào trang chủ thôi! 💜</button>
    </form>
    <div id="result" style="margin-top:10px;color:#ffb3d1;"></div>
</div>

<div id="formLoadingOverlay"></div>
<div id="pageTransitionOverlay"></div>

<script>
// ======== Particles ========
const canvas=document.getElementById('particles'); const ctx=canvas.getContext('2d');
let particles=[]; const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const particleCount=isMobile?40:90;
function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resizeCanvas();
const colors=['#ff69b4','#9d4edd','#c77dff'];
for(let i=0;i<particleCount;i++){ 
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        radius:Math.random()*(isMobile?2:3)+1,
        speedX:Math.random()*0.6-0.3,
        speedY:Math.random()*0.6-0.3,
        color:colors[Math.floor(Math.random()*colors.length)]
    });
}
function draw(){ 
    ctx.clearRect(0,0,canvas.width,canvas.height); 
    particles.forEach(p=>{
        ctx.fillStyle=p.color+(isMobile?'80':'99'); 
        ctx.beginPath(); 
        ctx.arc(p.x+=p.speedX,p.y+=p.speedY,p.radius,0,Math.PI*2); 
        ctx.fill(); 
        if(p.x<0||p.x>canvas.width)p.speedX*=-1; 
        if(p.y<0||p.y>canvas.height)p.speedY*=-1; 
    }); 
    requestAnimationFrame(draw); 
}
draw();

// ======== Sparkles ========


// ======== Captcha ========
let captchaAnswer=0;
function generateCaptcha(){ 
    const n1=Math.floor(Math.random()*41)+10;
    const n2=Math.floor(Math.random()*41)+10;
    const m1=Math.floor(Math.random()*11)+2;
    const m2=Math.floor(Math.random()*11)+2;
    const op=Math.floor(Math.random()*4);
    let q='';
    if(op===0){ captchaAnswer=n1+n2; q=`${n1}+${n2}=?`; }
    else if(op===1){ const l=Math.max(n1,n2); const s=Math.min(n1,n2); captchaAnswer=l-s; q=`${l}-${s}=?`; }
    else if(op===2){ captchaAnswer=m1*m2; q=`${m1} x ${m2} = ?`; }
    else{ const d=Math.floor(Math.random()*10)+2; const qot=Math.floor(Math.random()*10)+2; captchaAnswer=qot; q=`${d*qot} ÷ ${d} = ?`; }
    document.getElementById('captchaQuestion').innerText=q;
    document.getElementById('captchaInput').value='';
    checkCaptcha();
}
function checkCaptcha(){
    const userInput=parseInt(document.getElementById('captchaInput').value);
    const nameInput=document.getElementById('nameInput').value.trim();
    const btn=document.getElementById('submitButton');
    const err=document.getElementById('captchaError');
    const validName=nameInput.length>0;
    const validCaptcha=userInput===captchaAnswer;
    btn.disabled=!(validName && validCaptcha);
    err.style.display=(document.getElementById('captchaInput').value!=='' && !validCaptcha)?'block':'none';
}
document.getElementById('nameInput').addEventListener('input',checkCaptcha);
document.getElementById('captchaInput').addEventListener('input',checkCaptcha);
document.getElementById('refreshCaptchaButton').addEventListener('click',()=>{ generateCaptcha(); document.getElementById('captchaInput').focus(); });

// ======== Show Form ========
setTimeout(()=>{ 
    document.getElementById('loading').classList.add('loaded'); 
    document.getElementById('formBox').classList.add('visible'); 
},2000);

// ======== Form Submit ========
const form=document.getElementById('nameForm');
const formLoadingOverlay=document.getElementById('formLoadingOverlay');
const pageTransitionOverlay=document.getElementById('pageTransitionOverlay');
const submitBtn=document.getElementById('submitButton');
const originalText=submitBtn.innerText;

form.addEventListener('submit', async e=>{
    e.preventDefault();
    if(submitBtn.disabled){ checkCaptcha(); return; }

    const fd=new FormData();
    fd.append('entry.name',document.getElementById('nameInput').value.trim());
    // thêm các field nếu cần
    // fd.append('entry.group','Nhóm 1');
    // fd.append('entry.fb_name','FacebookUser');

    submitBtn.disabled=true; submitBtn.innerText='⏳ ĐANG GỬI...';
    try{
        const response=await fetch('https://script.google.com/macros/s/AKfycbyk1d5uFUkkJnWdaV8hsSK_NueqYE1k4YIOjvenqJlkcI7OQVoQ_AevjaWnKvPpEs8/exec',{method:'POST',body:fd});
        const res=await response.json();
        submitBtn.disabled=false; submitBtn.innerText=originalText;
        console.log(res); // log debug
        if(res.status==='success'){
            formLoadingOverlay.classList.add('show'); 
            formLoadingOverlay.innerText=`✔ Đã gửi! Chào ${res.game_name}. Đang chuyển trang...`;
            setTimeout(()=>{
                formLoadingOverlay.classList.remove('show');
                pageTransitionOverlay.classList.add('show-transition');
                pageTransitionOverlay.innerHTML=`<div class="spinner"></div><br>CHÀO MỪNG ${res.game_name.toUpperCase()}!<br>Đang tải trang...`;
                setTimeout(()=>window.location.href="trangchu.html",500);
            },1000);
        } else {
            document.getElementById('result').innerText='❌ Lỗi: '+res.message;
            generateCaptcha();
        }
    } catch(err){
        submitBtn.disabled=false; submitBtn.innerText=originalText;
        console.error(err);
        document.getElementById('result').innerText='❌ Lỗi kết nối. Vui lòng thử lại.';
        generateCaptcha();
    }
});

generateCaptcha();
window.addEventListener('resize',resizeCanvas);
</script>

</body>
</html>
