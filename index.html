<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhập tên</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background-image: url('ff1.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        -webkit-background-size: cover;
        -webkit-background-attachment: scroll;
        
        /* 💡 Sử dụng Flexbox để căn giữa tuyệt đối */
        display: flex;
        align-items: center; 
        justify-content: center; 
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7); 
        z-index: -1;
    }

    /* Loading ban đầu */
    #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column; 
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 24px; 
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        background-image: url('ff1.jpg');
        background-size: cover;
        background-position: center;
        box-shadow: inset 0 0 0 100vmax rgba(0,0,0,0.6);
        z-index: 999;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.5s ease;
    }

    .loaded {
        opacity: 0 !important;
        visibility: hidden !important;
    }
    
    /* 🌟 ANIMATION MỚI: Nhấp nháy nhẹ cho ánh sáng Neon */
    @keyframes pulsate {
        0% { box-shadow: 
            0 0 30px rgba(0, 0, 0, 0.9),
            0 0 15px rgba(255, 68, 68, 0.3); /* Ánh sáng mờ hơn */ 
        }
        50% { box-shadow: 
            0 0 30px rgba(0, 0, 0, 0.9),
            0 0 25px rgba(255, 68, 68, 0.6); /* Ánh sáng mạnh hơn */
        }
        100% { box-shadow: 
            0 0 30px rgba(0, 0, 0, 0.9),
            0 0 15px rgba(255, 68, 68, 0.3); /* Quay lại ánh sáng mờ */
        }
    }

    /* ⭐ Form nhập tên ⭐ */
    #formBox {
        position: relative; 
        display: none;
        max-width: 380px; 
        margin: auto; 
        padding: 35px; 
        
        background: rgba(20, 20, 20, 0.85); 
        backdrop-filter: blur(8px); 
        -webkit-backdrop-filter: blur(8px);
        
        border-radius: 15px; 
        
        /* Áp dụng hiệu ứng Glow Animation */
        animation: 
            show 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94),
            pulsate 3s ease-in-out infinite; /* THÊM VÀO ĐÂY */
        
        border: 1px solid rgba(255, 68, 68, 0.2); 
        overflow: hidden; 
    }
    
    #formBox h2 {
        text-align: center;
        margin-bottom: 25px; 
        color: #fff; 
        font-size: 26px;
        text-shadow: 0 0 10px rgba(255, 68, 68, 0.8), 0 0 5px rgba(255, 255, 255, 0.5); 
    }

    @keyframes show {
        from { opacity: 0; transform: translateY(40px) scale(0.95); }
        to 	 { opacity: 1; transform: translateY(0) scale(1); }
    }

    input {
        width: 100%;
        padding: 16px 15px; 
        margin-top: 15px;
        border-radius: 10px;
        border: 2px solid #555; 
        background-color: #0d0d0d; 
        color: #fff;
        font-size: 18px; 
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
    }

    input:focus {
        border-color: #ff4444; 
        box-shadow: 0 0 10px rgba(255, 68, 68, 0.8), inset 0 0 5px rgba(255, 68, 68, 0.4); 
        background-color: #1a1a1a; 
    }
    
    input::placeholder {
        color: #aaa; 
    }

    /* 🔒 CAPTCHA Styling */
    #captchaContainer {
        display: flex;
        align-items: stretch; 
        gap: 10px; 
        margin-top: 15px;
    }

    #captchaQuestion {
        flex: 3; 
        padding: 16px 15px; 
        background-color: #1a1a1a; 
        border-radius: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        color: #00ff88; 
        border: 2px solid #555; 
        box-shadow: 0 0 8px rgba(0, 255, 136, 0.2); 
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 0; 
    }
    
    #captchaInput {
        flex: 2; 
        padding-right: 15px; 
        text-align: center; 
    }
    
    .captcha-error {
        margin-top: 8px; 
        color: #ff3333; 
        font-size: 15px; 
        text-align: center;
        display: none;
        font-weight: 500;
    }
    /* Kết thúc CAPTCHA Styling */

    button {
        width: 100%;
        padding: 14px;
        margin-top: 25px; 
        background: linear-gradient(135deg, #ff4444, #e63939); 
        color: #fff;
        border: none;
        border-radius: 10px; 
        font-size: 19px; 
        font-weight: bold;
        text-transform: uppercase; 
        letter-spacing: 1px; 
        cursor: pointer;
        transition: all 0.3s ease; 
        box-shadow: 0 4px 15px rgba(255, 68, 68, 0.4); 
        
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden; 
        position: relative; 
        z-index: 1; 
    }

    button:hover {
        background: linear-gradient(135deg, #e63939, #cc2929); 
        box-shadow: 0 6px 20px rgba(255, 68, 68, 0.6); 
        transform: translateY(-2px) scale(1.01); 
    }
    
    button:active {
        transform: translateY(1px) scale(0.99); 
        box-shadow: 0 2px 10px rgba(255, 68, 68, 0.3); 
    }

    button:disabled {
        background: #555;
        box-shadow: none;
        cursor: not-allowed;
        transform: none; 
        opacity: 0.7; 
    }

    /* Hiệu ứng gợn sóng khi nhấp vào nút */
    button::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background-color: rgba(255, 255, 255, 0.2);
        opacity: 0;
        transition: all 0.5s ease-out;
        border-radius: 10px;
        transform: scale(0);
        z-index: -1;
    }

    button:active::after {
        transform: scale(1);
        opacity: 1;
        transition: 0s; 
    }


    #result {
        margin-top: 15px;
        font-size: 18px;
        text-align: center;
        color: #00ff88; 
        text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
    }
    
    /* Loading overlay trong Form */
    #formLoadingOverlay {
        position: absolute;
        inset: 0;
        background: rgba(20, 20, 20, 0.98);
        border-radius: 12px;
        display: none; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ff4444;
        font-size: 20px;
        z-index: 100;
        transition: opacity 0.3s ease;
    }

    /* ⭐ Màn hình chuyển tiếp giữa các trang ⭐ */
    #pageTransitionOverlay {
        position: fixed;
        inset: 0;
        background-color: #000;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 1s ease-in-out, visibility 1s ease-in-out; 
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ff4444;
        font-size: 24px;
        flex-direction: column;
        text-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
    }

    #pageTransitionOverlay.show-transition {
        opacity: 1;
        visibility: visible;
    }
    
    /* 🚀 SPINNER */
    /* Spinner cho màn hình Loading ban đầu và Transition */
    .spinner {
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid #ff4444;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin-bottom: 10px;
    }
    
    /* Spinner cho nút button */
    .button-spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #fff; 
        border-radius: 50%;
        width: 18px;
        height: 18px;
        animation: spin 1.2s linear infinite;
        margin-right: 8px; 
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    Đang tải...
</div>

<div id="formBox">
    <h2>NHẬP TÊN NGƯỜI CHƠI</h2>

    <div id="formLoadingOverlay">
        Đang xử lý dữ liệu...
    </div>
    <form id="nameForm">
        <input type="text" name="entry.name" id="nameInput" placeholder="Tên của bạn..." required>
        
        <div id="captchaContainer">
            <div id="captchaQuestion"></div>
            <input type="number" id="captchaInput" placeholder="Kết quả" required>
        </div>
        <p class="captcha-error" id="captchaError">❌ Kết quả không đúng. Vui lòng thử lại.</p>
        <button type="submit" id="submitButton" disabled>BẮT ĐẦU CHƠI</button>
    </form>

    <p id="result"></p>
</div>

<div id="pageTransitionOverlay">
    <div class="spinner"></div>
    Đang tải trang...
</div>

<script>
let captchaAnswer = 0; // Biến lưu đáp án Captcha

function generateCaptcha() {
    // Tạo 2 số ngẫu nhiên từ 1 đến 10
    const num1 = Math.floor(Math.random() * 10) + 1;
    const num2 = Math.floor(Math.random() * 10) + 1;
    
    // Đảm bảo phép tính đơn giản (chỉ cộng)
    captchaAnswer = num1 + num2;
    document.getElementById('captchaQuestion').innerText = `${num1} + ${num2} = ?`;
    document.getElementById('captchaInput').value = ''; // Xóa input cũ
}

function checkCaptcha() {
    const userInput = parseInt(document.getElementById('captchaInput').value);
    const nameInput = document.getElementById('nameInput').value.trim();
    const isNameValid = nameInput.length > 0;
    const isCaptchaCorrect = userInput === captchaAnswer;

    const submitButton = document.getElementById('submitButton');
    const errorText = document.getElementById('captchaError');

    if (isNameValid && isCaptchaCorrect) {
        submitButton.disabled = false;
        errorText.style.display = 'none';
    } else {
        submitButton.disabled = true;
    }
    
    // Chỉ hiển thị lỗi nếu người dùng đã nhập Captcha nhưng sai
    if (document.getElementById('captchaInput').value !== '' && !isCaptchaCorrect) {
        errorText.style.display = 'block';
    } else {
        errorText.style.display = 'none';
    }
}

// Gọi hàm tạo Captcha khi trang tải xong
window.onload = generateCaptcha; 

// ----------------------------------------------------
// CODE CHÍNH
// ----------------------------------------------------

const formBox = document.getElementById("formBox");
const loadingScreen = document.getElementById("loading");
const formLoadingOverlay = document.getElementById("formLoadingOverlay"); 
const pageTransitionOverlay = document.getElementById("pageTransitionOverlay");
const submitButton = document.getElementById("submitButton");
const originalButtonText = submitButton.innerText;

// Bắt sự kiện nhập liệu trên cả tên và Captcha để kiểm tra điều kiện kích hoạt nút
document.getElementById('nameInput').addEventListener('input', checkCaptcha);
document.getElementById('captchaInput').addEventListener('input', checkCaptcha);


// Hiện form sau 2s
setTimeout(() => {
    loadingScreen.classList.add('loaded');
    setTimeout(() => {
        formBox.style.display = "block";
    }, 500); 
}, 2000); 

document.getElementById("nameForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    // Kiểm tra Captcha lần cuối trước khi submit
    if (document.getElementById('submitButton').disabled) {
        // Nếu nút đang bị khóa (Captcha sai hoặc chưa nhập tên), không làm gì cả
        checkCaptcha(); 
        return;
    }

    const formData = new FormData(this);
    const url = "https://script.google.com/macros/s/AKfycbyk1d5uFUkkJnWdaV8hsSK_NueqYE1k4YIOjvenqJlkcI7OQVoQ_AevjaWnKvPpEs8/exec";

    // 1. Kích hoạt hiệu ứng loading trên nút
    submitButton.disabled = true;
    submitButton.innerHTML = '<div class="button-spinner"></div> ĐANG GỬI...'; 

    try {
        const response = await fetch(url, {
            method: "POST",
            body: formData
        });

        const res = await response.json();

        // 2. Tắt hiệu ứng loading
        submitButton.disabled = false;
        submitButton.innerHTML = originalButtonText;

        if (res.status === "success") {
            // Hiển thị overlay form loading trong quá trình chuyển trang 
            formLoadingOverlay.style.display = "flex"; 
            formLoadingOverlay.innerHTML = `✔ Đã gửi! Chào ${res.game_name}. Đang chuyển trang...`;

            setTimeout(() => {
                // Tắt form overlay và bắt đầu chuyển trang
                formLoadingOverlay.style.display = "none";
                pageTransitionOverlay.classList.add('show-transition');
                pageTransitionOverlay.innerHTML = `<div class="spinner"></div> CHÀO MỪNG ${res.game_name.toUpperCase()}! <br> Đang tải trang...`;
                
                setTimeout(() => {
                    window.location.href = "trangchu.html";
                }, 500);
            }, 1000);

        } else {
            document.getElementById("result").innerText = "❌ Lỗi: " + res.message;
            generateCaptcha(); // Tạo Captcha mới khi submit lỗi
        }
    } catch (error) {
        // 2. Tắt hiệu ứng loading khi có lỗi
        submitButton.disabled = false;
        submitButton.innerHTML = originalButtonText;
        document.getElementById("result").innerText =
            "❌ Lỗi kết nối. Vui lòng kiểm tra mạng và thử lại.";
        generateCaptcha(); // Tạo Captcha mới khi có lỗi kết nối
    }
});
</script>

</body>
</html>
