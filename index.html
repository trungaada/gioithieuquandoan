<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ Chào bạn đến với thế giới của chúng mình ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --pink: #ff4785;
    --purple: #845ec2;
    --cyan: #00d2ff;
    --yellow: #ffc75f;
    --bg-deep: #090314;
    --glass-bg: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; color: #fff; }

body {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-deep);
    -webkit-font-smoothing: antialiased;
    position: relative;
}

/* Aurora Background Glows */
.aurora-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.aurora-blob {
    position: absolute; width: 50vw; height: 50vw; border-radius: 50%;
    filter: blur(80px); opacity: 0.35; animation: floatBlob 15s infinite alternate ease-in-out;
}
.blob-1 { background: var(--pink); top: -20%; left: -10%; animation-delay: 0s; }
.blob-2 { background: var(--purple); bottom: -20%; right: -10%; animation-delay: -5s; }
.blob-3 { background: var(--cyan); top: 30%; right: 20%; width: 35vw; height: 35vw; animation-delay: -10s; opacity: 0.2; }

@keyframes floatBlob {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 40px) scale(1.15); }
}

/* Particles canvas */
#particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

/* Shooting Stars Container */
#shooting-stars { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.shooting-star {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,1), rgba(0,210,255,0));
    border-radius: 50%;
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
    animation: shoot linear infinite;
}
@keyframes shoot {
    0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
    100% { transform: translateX(-800px) translateY(800px) rotate(-45deg); opacity: 0; }
}

/* Loading Screen */
#loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 999; background: var(--bg-deep); transition: opacity 0.8s ease, visibility 0.8s ease;
}
#loading h1 {
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 600; text-align: center; padding: 0 20px;
    animation: pulseText 2s infinite alternate;
}
@keyframes pulseText {
    0% { opacity: 0.7; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.02); }
}
.loaded { opacity: 0; visibility: hidden; pointer-events: none; }

/* Form Box */
#formBox {
    max-width: 440px; width: 90%; padding: 42px 34px;
    background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 32px; border: 1px solid var(--glass-border);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    text-align: center; position: relative; z-index: 10;
    opacity: 0; transform: translateY(30px) scale(0.96);
    transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); display: none;
}
#formBox.visible { opacity: 1; transform: translateY(0) scale(1); display: block; }

h2 {
    font-size: clamp(1.8rem, 4vw, 2.2rem);
    background: linear-gradient(135deg, #fff, #d8c7ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px; font-weight: 600;
}
#formBox p { color: #bca8e8; margin-bottom: 24px; font-size: 0.95rem; }

input, #captchaQuestion {
    width: 100%; padding: 15px 20px; margin: 10px 0; border-radius: 16px; outline: none; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 1rem; font-family: 'Poppins', sans-serif;
}
input {
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff;
}
input::placeholder { color: rgba(255, 255, 255, 0.35); }
input:focus {
    background: rgba(255, 255, 255, 0.08); border-color: var(--pink);
    box-shadow: 0 0 25px rgba(255, 71, 133, 0.3), inset 0 0 10px rgba(255, 71, 133, 0.1);
}

#captchaContainer { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 12px 0 4px 0; }
#captchaQuestion {
    background: rgba(132, 94, 194, 0.15); border: 1px solid rgba(132, 94, 194, 0.3);
    font-weight: 600; font-size: 1.1rem; text-align: center; color: #edd8ff; letter-spacing: 1px;
}
#refreshCaptchaButton {
    width: 48px; height: 48px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px; font-size: 1.3rem; color: var(--pink); cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; align-items: center; justify-content: center;
}
#refreshCaptchaButton:hover { background: var(--pink); color: #fff; border-color: var(--pink); transform: rotate(180deg) scale(1.05); }

.captcha-error { color: #ff8fab; font-size: 0.85rem; margin-top: 4px; opacity: 0; transform: translateY(-5px); transition: all 0.3s; }
.captcha-error.show { opacity: 1; transform: translateY(0); }

button#submitButton {
    width: 100%; padding: 16px; margin-top: 22px; border: none; border-radius: 16px; color: white;
    font-size: 1.05rem; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow: 0 10px 30px rgba(255, 71, 133, 0.35); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; overflow: hidden;
}
button#submitButton::after {
    content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,0.2), transparent);
    opacity: 0; transition: opacity 0.3s;
}
button#submitButton:hover:not(:disabled)::after { opacity: 1; }
button#submitButton:hover:not(:disabled) {
    transform: translateY(-2px); box-shadow: 0 15px 40px rgba(255, 71, 133, 0.5); filter: brightness(1.05);
}
button#submitButton:active:not(:disabled) { transform: translateY(0); }
button#submitButton:disabled { background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.25); cursor: not-allowed; box-shadow: none; }

#formLoadingOverlay, #pageTransitionOverlay {
    display: none; position: fixed; inset: 0; background: rgba(9, 3, 20, 0.88); backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px); color: #fff; font-size: 1.25rem; z-index: 9999; 
    align-items: center; justify-content: center; text-align: center; flex-direction: column; padding: 20px;
}
#formLoadingOverlay.show, #pageTransitionOverlay.show-transition { display: flex; }

/* Shake animation */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
}
#formBox.shake { animation: shake 0.4s ease-in-out; }
</style>
</head>
<body>

<!-- Aurora Animated Background Glows -->
<div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
</div>

<canvas id="particles"></canvas>
<div id="shooting-stars"></div>

<div id="loading">
    <h1>✨  Xác minh danh tính... ✨</h1>
</div>

<div id="formBox">
    <h2>Nhập tên của bạn nào!</h2>
    <p>Để vào trang chủ nha~ 💖</p>

    <form id="nameForm">
        <input type="text" id="nameInput" placeholder="Tên của bạn là gì?" required autocomplete="off">
        <div id="captchaContainer">
            <div id="captchaQuestion">? ? ?</div>
            <button type="button" id="refreshCaptchaButton" title="Đổi câu hỏi">↻</button>
            <input type="number" id="captchaInput" placeholder="= ?" autocomplete="off">
        </div>
        <p class="captcha-error" id="captchaError"> Sai rồi, thử lại nha ❤️️</p>
        <button type="submit" id="submitButton" disabled>Vào trang chủ thôi!</button>
    </form>
    <div id="result" style="margin-top: 14px; font-size: 0.9rem; color: #ff8fab;"></div>
</div>

<div id="formLoadingOverlay"></div>
<div id="pageTransitionOverlay"></div>

<script>
// ======== Shooting Stars Effect ========
function createShootingStar() {
    const container = document.getElementById('shooting-stars');
    if (!container) return;
    const star = document.createElement('div');
    star.className = 'shooting-star';
    
    const startX = Math.random() * window.innerWidth + 300;
    const startY = Math.random() * (window.innerHeight / 2);
    const duration = Math.random() * 1.5 + 1;
    const length = Math.random() * 80 + 70;
    
    star.style.left = startX + 'px';
    star.style.top = startY + 'px';
    star.style.width = length + 'px';
    star.style.animationDuration = duration + 's';
    
    container.appendChild(star);
    
    setTimeout(() => {
        star.remove();
    }, duration * 1000);
}
setInterval(createShootingStar, 400);

// ======== Particles ========
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const particleCount = isMobile ? 30 : 60;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();

const colors = ['#ff4785', '#845ec2', '#00d2ff', '#ffc75f'];
for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * (isMobile ? 1.5 : 2.5) + 0.8,
        speedX: (Math.random() - 0.5) * 0.35,
        speedY: (Math.random() - 0.5) * 0.35,
        color: colors[Math.floor(Math.random() * colors.length)]
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        ctx.fillStyle = p.color + '99';
        ctx.beginPath();
        ctx.arc(p.x += p.speedX, p.y += p.speedY, p.radius, 0, Math.PI * 2);
        ctx.fill();
        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
    });
    requestAnimationFrame(draw);
}
draw();

// ======== Captcha ========
let captchaAnswer = 0;
function generateCaptcha() {
    const n1 = Math.floor(Math.random() * 30) + 5;
    const n2 = Math.floor(Math.random() * 30) + 5;
    const m1 = Math.floor(Math.random() * 9) + 2;
    const m2 = Math.floor(Math.random() * 9) + 2;
    const op = Math.floor(Math.random() * 3);
    let q = '';
    
    if (op === 0) { captchaAnswer = n1 + n2; q = `${n1} + ${n2} = ?`; }
    else if (op === 1) { const l = Math.max(n1, n2); const s = Math.min(n1, n2); captchaAnswer = l - s; q = `${l} - ${s} = ?`; }
    else { captchaAnswer = m1 * m2; q = `${m1} × ${m2} = ?`; }

    document.getElementById('captchaQuestion').innerText = q;
    document.getElementById('captchaInput').value = '';
    checkCaptcha();
}

function checkCaptcha() {
    const userInputVal = document.getElementById('captchaInput').value;
    const userInput = parseInt(userInputVal);
    const nameInput = document.getElementById('nameInput').value.trim();
    const btn = document.getElementById('submitButton');
    const err = document.getElementById('captchaError');
    const formBox = document.getElementById('formBox');
    
    const validName = nameInput.length > 0;
    const validCaptcha = userInputVal !== '' && userInput === captchaAnswer;

    btn.disabled = !(validName && validCaptcha);

    if (userInputVal !== '' && !validCaptcha) {
        err.classList.add('show');
        if (!formBox.classList.contains('shake')) {
            formBox.classList.add('shake');
            setTimeout(() => formBox.classList.remove('shake'), 400);
        }
    } else {
        err.classList.remove('show');
    }
}

document.getElementById('nameInput').addEventListener('input', checkCaptcha);
document.getElementById('captchaInput').addEventListener('input', checkCaptcha);
document.getElementById('refreshCaptchaButton').addEventListener('click', () => {
    generateCaptcha();
    document.getElementById('captchaInput').focus();
});

// ======== Show Form ========
setTimeout(() => {
    document.getElementById('loading').classList.add('loaded');
    document.getElementById('formBox').classList.add('visible');
}, 1400);

// ======== Form Submit ========
const form = document.getElementById('nameForm');
const formLoadingOverlay = document.getElementById('formLoadingOverlay');
const pageTransitionOverlay = document.getElementById('pageTransitionOverlay');
const submitBtn = document.getElementById('submitButton');
const originalText = submitBtn.innerText;

form.addEventListener('submit', async e => {
    e.preventDefault();
    if (submitBtn.disabled) return;

    const nameVal = document.getElementById('nameInput').value.trim();
    submitBtn.disabled = true;
    submitBtn.innerText = 'Đang gửi yêu cầu...';

    // Tạo URLSearchParams với key "entry.name" để khớp chính xác với Apps Script
    const formData = new URLSearchParams();
    formData.append('entry.name', nameVal);

    try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbx26LkWCV7GXmfl8x2L_M5QCH1KCckAIoVV-uSSW2x6CsXWQ-TFnUU_KDoQR85MqHRy/exec', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8'
            },
            body: formData.toString()
        });
        
        const res = await response.json();
        
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;

        if (res.status === 'success') {
            formLoadingOverlay.classList.add('show');
            formLoadingOverlay.innerHTML = `<p style="margin-top:18px; font-size:1.3rem;">✔ Đã xác thực! Chào <b>${res.game_name || nameVal}</b>.<br><span style="font-size:0.95rem;color:#bca8e8;">Đang chuẩn bị vào nhà...</span></p>`;
            setTimeout(() => {
                formLoadingOverlay.classList.remove('show');
                pageTransitionOverlay.classList.add('show-transition');
                pageTransitionOverlay.innerHTML = `<span style="background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:600;font-size:1.4rem;">CHÀO MỪNG ${(res.game_name || nameVal).toUpperCase()}!</span><br><span style="font-size:0.9rem;color:#bca8e8;margin-top:8px;">Hành trình bắt đầu... ✨</span>`;
                setTimeout(() => window.location.href = "trangchu.html", 900);
            }, 1000);
        } else {
            document.getElementById('result').innerText = '❌ Lỗi: ' + (res.message || 'Không xác định');
            generateCaptcha();
        }
    } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
        console.error(err);
        document.getElementById('result').innerText = '❌ Lỗi kết nối. Vui lòng thử lại.';
        generateCaptcha();
    }
});

generateCaptcha();
window.addEventListener('resize', resizeCanvas);
</script>

</body>
</html>
